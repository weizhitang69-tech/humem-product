[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humem-product"
version = "0.1.0"
description = "A lightweight layered memory RAG module extracted from HuMem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [
  { name = "HuMem Contributors" }
]

[project.scripts]
humem-product = "humem_product.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humem_product = ["viewer/*", "viewer/vendor/*"]
