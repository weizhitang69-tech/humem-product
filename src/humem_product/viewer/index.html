<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HuMem Memory Space</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="HuMem 3D memory graph"></canvas>
      <div class="memory-vignette" aria-hidden="true"></div>

      <header class="topbar">
        <div class="identity">
          <div class="brand">HuMem Memory Space</div>
          <div class="stats" id="stats">Loading memory graph...</div>
          <div class="vitals" id="vitals"></div>
        </div>
        <div class="toolbar">
          <div class="mode-switch" aria-label="view mode">
            <button class="mode-button is-active" type="button" data-mode="organism" title="Organism view">O</button>
            <button class="mode-button" type="button" data-mode="anchors" title="Anchor focus">A</button>
            <button class="mode-button" type="button" data-mode="deep" title="Deep memory focus">D</button>
          </div>
          <input id="search" type="search" placeholder="搜索记忆" autocomplete="off" />
          <button id="resetView" class="icon-button" type="button" title="重置视角" aria-label="重置视角">↺</button>
        </div>
      </header>

      <aside class="layer-panel">
        <div class="panel-title">Memory Lamina</div>
        <div id="layerToggles" class="layer-list"></div>
      </aside>

      <aside class="insight-panel">
        <div class="panel-title">Recall Field</div>
        <div id="insights" class="insight-grid"></div>
      </aside>

      <aside id="details" class="details-panel">
        <div class="empty-state">选择一个记忆节点</div>
      </aside>

      <div id="tooltip" class="tooltip"></div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
